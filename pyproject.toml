[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lab03-ppe"
version = "0.1.0"
description = "Reproducible YOLOv8 PPE laboratory"
requires-python = ">=3.11"
dependencies = ["ultralytics", "imagehash", "pyyaml", "psutil"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

